name: Сборка APK пульта

# Запускается вручную: вкладка Actions -> "Сборка APK пульта" -> Run workflow.
# Собирает отладочный APK (подписывается автоматически, ключи не нужны)
# и выкладывает его на страницу Releases как пре-релиз, чтобы скачать прямо с телефона.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Собрать отладочный APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Файл APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/wled-remote-debug.apk

      - name: Сохранить как файл сборки (запасной вариант)
        uses: actions/upload-artifact@v4
        with:
          name: wled-remote-debug
          path: dist/wled-remote-debug.apk

      - name: Выложить на страницу Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="remote-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/wled-remote-debug.apk \
            --title "Пульт, отладочная сборка #${GITHUB_RUN_NUMBER}" \
            --notes "Собрано вручную из ветки ${GITHUB_REF_NAME}" \
            --prerelease --target "$GITHUB_SHA"