name: Проверка кода пульта

# Сама запускается при пуше в ветки feature/*: собирает код.
# Можно запустить и вручную: Actions -> "Проверка кода пульта" -> Run workflow.
on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Тесты
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Сборка
        run: ./gradlew assembleDebug --no-daemon
