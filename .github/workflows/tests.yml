name: Проверка кода пульта

# Сама запускается при пуше в ветки feature/*: собирает код и гоняет тесты.
# Можно запустить и вручную: Actions -> "Проверка кода пульта" -> Run workflow.
on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Тесты и сборка
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Отчёт о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
